name: Validate Docker stack

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-config:
    name: Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show Docker Compose version
        run: docker compose version

      - name: Validate Compose config
        run: docker compose --env-file .env --env-file versions.env config --quiet

      - name: Validate Compose config with example env
        run: docker compose --env-file .env.example --env-file versions.env config --quiet

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck scripts/smoke-test.sh zou/init-db.sh backups/backup.sh

  docker-builds:
    name: Docker builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - compose-config
      - shellcheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Zou image without publishing
        run: |
          set -eu
          zou_version="$(grep '^ZOU_VERSION=' versions.env | cut -d= -f2 | tr -d '\r')"
          docker buildx build --load --build-arg "ZOU_VERSION=${zou_version}" -f zou/Dockerfile ./zou

      - name: Build Kitsu web image without publishing
        run: |
          set -eu
          kitsu_version="$(grep '^KITSU_VERSION=' versions.env | cut -d= -f2 | tr -d '\r')"
          docker buildx build --load --target kitsu-web --build-arg "KITSU_VERSION=${kitsu_version}" --build-arg VITE_API_URL=/api -f Dockerfile .

      - name: Build db backup image without publishing
        run: docker buildx build --load -f backups/Dockerfile ./backups
