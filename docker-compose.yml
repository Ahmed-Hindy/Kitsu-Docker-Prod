networks:
  web:
    name: kitsu_web
    external: false
  internal:
    name: kitsu_internal
    external: false

volumes:
  pgdata:
    name: kitsu_pgdata
  traefik_letsencrypt:
    name: kitsu_traefik_letsencrypt
  backups:
    name: kitsu_backups
  previews:
    name: kitsu_previews
  zou_tmp:
    name: kitsu_zou_tmp
  meili:
    name: kitsu_meili

services:
  traefik:
    image: traefik:v3.7.6
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL to a real email address for Let's Encrypt}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      - traefik_letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web
    restart: unless-stopped

  db:
    image: postgres:${POSTGRES_VERSION:?Set POSTGRES_VERSION in versions.env}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kitsu}
      POSTGRES_USER: ${POSTGRES_USER:-kitsu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kitsu_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -p $${REDIS_PORT:-6379} ping | grep -q PONG" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  meilisearch:
    image: getmeili/meilisearch:${MEILI_VERSION:?Set MEILI_VERSION in versions.env}
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - meili:/meili_data
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:$${MEILI_PORT:-7700}/health | grep -q available" ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - internal

  nginx:
    image: nginx:alpine
    depends_on:
      kitsu-web:
        condition: service_healthy
      zou-api:
        condition: service_healthy
      zou-events:
        condition: service_healthy
    ports:
      - "${KITSU_WEB_HOST_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=kitsu_web"
      - "traefik.http.services.kitsu.loadbalancer.server.port=80"
      - "traefik.http.routers.kitsu-http.rule=Host(`${KITSU_DOMAIN:-localhost}`)"
      - "traefik.http.routers.kitsu-http.entrypoints=web"
      - "traefik.http.routers.kitsu-http.service=kitsu"
      - "traefik.http.routers.kitsu-https.rule=Host(`${KITSU_DOMAIN:-localhost}`)"
      - "traefik.http.routers.kitsu-https.entrypoints=websecure"
      - "traefik.http.routers.kitsu-https.service=kitsu"
      - "traefik.http.routers.kitsu-https.tls=true"
      - "traefik.http.routers.kitsu-https.tls.certresolver=letsencrypt"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1/" ]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  zou-api:
    image: ghcr.io/ahmed-hindy/kitsu-zou:${ZOU_VERSION:?Set ZOU_VERSION in versions.env}
    env_file:
      - .env
    ports:
      - "${ZOU_API_HOST_PORT:-5001}:${ZOU_API_INTERNAL_PORT:-8000}"
    environment:
      # ---- DB config (for Zou) ----
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${POSTGRES_DB}
      # ---- Redis / KV store ----
      KV_TYPE: redis
      KV_HOST: redis
      KV_PORT: ${REDIS_PORT}
      # ---- Meilisearch indexer ----
      INDEXER_TYPE: meilisearch
      INDEXER_HOST: meilisearch
      INDEXER_PORT: ${MEILI_PORT}
      INDEXER_KEY: ${MEILI_MASTER_KEY}
      # ---- Security / app settings ----
      SECRET_KEY: ${ZOU_SECRET_KEY}
      LOG_LEVEL: ${ZOU_LOG_LEVEL}
      ENABLE_JOB_QUEUE: ${ENABLE_JOB_QUEUE:-True}
      JOB_QUEUE_TIMEOUT: ${JOB_QUEUE_TIMEOUT:-3600}

      MAIL_SERVER: mailcatcher
      MAIL_PORT: ${MAILCATCHER_SMTP_PORT}
      MAIL_DEFAULT_SENDER: "kitsu@example.com"
      MAIL_USE_TLS: false
      MAIL_USE_SSL: false
      DOMAIN_PROTOCOL: ${DOMAIN_PROTOCOL}
      DOMAIN_NAME: ${DOCKER_HOST_IP:-localhost}:${KITSU_WEB_HOST_PORT:-8080}
      CORS_ALLOWED_ORIGINS: ${KITSU_WEB_URL:-http://localhost:8080}
      PREVIEW_FOLDER: ${PREVIEW_FOLDER:-/opt/zou/previews}
      TMP_DIR: ${TMP_DIR:-/tmp/zou}
    volumes:
      - previews:${PREVIEW_FOLDER:-/opt/zou/previews}
      - zou_tmp:${TMP_DIR:-/tmp/zou}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      zou-init-db:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "/opt/venv/bin/python -c 'import os, urllib.request; port = os.environ.get(\"ZOU_API_INTERNAL_PORT\", \"8000\"); response = urllib.request.urlopen(\"http://127.0.0.1:%s/\" % port, timeout=5); raise SystemExit(0 if response.status < 500 else 1)'" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - internal
    restart: unless-stopped

  zou-events:
    image: ghcr.io/ahmed-hindy/kitsu-zou:${ZOU_VERSION:?Set ZOU_VERSION in versions.env}
    env_file:
      - .env
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${POSTGRES_DB}

      KV_TYPE: redis
      KV_HOST: redis
      KV_PORT: ${REDIS_PORT}

      INDEXER_TYPE: meilisearch
      INDEXER_HOST: meilisearch
      INDEXER_PORT: ${MEILI_PORT}
      INDEXER_KEY: ${MEILI_MASTER_KEY}

      SECRET_KEY: ${ZOU_SECRET_KEY}
      LOG_LEVEL: ${ZOU_LOG_LEVEL}
      ENABLE_JOB_QUEUE: ${ENABLE_JOB_QUEUE:-True}
      JOB_QUEUE_TIMEOUT: ${JOB_QUEUE_TIMEOUT:-3600}

      MAIL_SERVER: mailcatcher
      MAIL_PORT: ${MAILCATCHER_SMTP_PORT}
      MAIL_DEFAULT_SENDER: "kitsu@example.com"
      MAIL_USE_TLS: false
      MAIL_USE_SSL: false
      DOMAIN_PROTOCOL: ${DOMAIN_PROTOCOL}
      DOMAIN_NAME: ${DOCKER_HOST_IP:-localhost}:${KITSU_WEB_HOST_PORT:-8080}

    # run ONLY the events server here
    command: >
      gunicorn --workers=1 --worker-class=geventwebsocket.gunicorn.workers.GeventWebSocketWorker -b 0.0.0.0:${ZOU_EVENTS_INTERNAL_PORT:-5001} zou.event_stream:app

    # optional, for debugging from host:
    # ports:
    #   - "5002:${ZOU_API_PORT}"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      zou-init-db:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "/opt/venv/bin/python -c 'import os, socket; port = int(os.environ.get(\"ZOU_EVENTS_INTERNAL_PORT\", \"5001\")); socket.create_connection((\"127.0.0.1\", port), timeout=5).close()'" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - internal
    restart: unless-stopped

  zou-jobs:
    image: ghcr.io/ahmed-hindy/kitsu-zou:${ZOU_VERSION:?Set ZOU_VERSION in versions.env}
    env_file:
      - .env
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${POSTGRES_DB}

      KV_TYPE: redis
      KV_HOST: redis
      KV_PORT: ${REDIS_PORT}

      INDEXER_TYPE: meilisearch
      INDEXER_HOST: meilisearch
      INDEXER_PORT: ${MEILI_PORT}
      INDEXER_KEY: ${MEILI_MASTER_KEY}

      SECRET_KEY: ${ZOU_SECRET_KEY}
      LOG_LEVEL: ${ZOU_LOG_LEVEL}
      ENABLE_JOB_QUEUE: ${ENABLE_JOB_QUEUE:-True}
      JOB_QUEUE_TIMEOUT: ${JOB_QUEUE_TIMEOUT:-3600}
      PREVIEW_FOLDER: ${PREVIEW_FOLDER:-/opt/zou/previews}
      TMP_DIR: ${TMP_DIR:-/tmp/zou}
    command: [ "/opt/venv/bin/rq", "worker", "-c", "zou.job_settings" ]
    volumes:
      - previews:${PREVIEW_FOLDER:-/opt/zou/previews}
      - zou_tmp:${TMP_DIR:-/tmp/zou}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      zou-init-db:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "/opt/venv/bin/python -c 'import os; from redis import Redis; Redis(host=os.environ.get(\"KV_HOST\", \"redis\"), port=int(os.environ.get(\"KV_PORT\", \"6379\")), socket_connect_timeout=5).ping()'" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - internal
    restart: unless-stopped

  zou-init-db:
    image: ghcr.io/ahmed-hindy/kitsu-zou:${ZOU_VERSION:?Set ZOU_VERSION in versions.env}
    env_file:
      - .env
    environment:
      # ---- DB config (for Zou) ----
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${POSTGRES_DB}

      # ---- Redis / KV store ----
      KV_TYPE: redis
      KV_HOST: redis
      KV_PORT: ${REDIS_PORT}

      # ---- Meilisearch indexer ----
      INDEXER_TYPE: meilisearch
      INDEXER_HOST: meilisearch
      INDEXER_PORT: ${MEILI_PORT}
      INDEXER_KEY: ${MEILI_MASTER_KEY}

      # ---- Security / app settings ----
      SECRET_KEY: ${ZOU_SECRET_KEY}
      LOG_LEVEL: ${ZOU_LOG_LEVEL}
      ENABLE_JOB_QUEUE: ${ENABLE_JOB_QUEUE:-True}
      JOB_QUEUE_TIMEOUT: ${JOB_QUEUE_TIMEOUT:-3600}
      PREVIEW_FOLDER: ${PREVIEW_FOLDER:-/opt/zou/previews}
      TMP_DIR: ${TMP_DIR:-/tmp/zou}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    volumes:
      - previews:${PREVIEW_FOLDER:-/opt/zou/previews}
      - zou_tmp:${TMP_DIR:-/tmp/zou}
      - ./zou/init-db.sh:/usr/local/bin/zou-init-db:ro
    networks:
      - internal
    entrypoint: [ "sh", "/usr/local/bin/zou-init-db" ]
    restart: "no"

  kitsu-web:
    image: ghcr.io/ahmed-hindy/kitsu-web:${KITSU_VERSION:?Set KITSU_VERSION in versions.env}
    environment:
      VITE_API_URL: /api
    depends_on:
      zou-api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1/" ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - web
      - internal
    restart: unless-stopped

  db-backup:
    build:
      context: ./backups
    image: ghcr.io/ahmed-hindy/kitsu-db-backup:${BACKUP_IMAGE_TAG:?Set BACKUP_IMAGE_TAG in versions.env}
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGHOST: db
      BACKUP_CRON: ${BACKUP_CRON:-30 1 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      PREVIEW_BACKUP_RETENTION_DAYS: ${PREVIEW_BACKUP_RETENTION_DAYS:-14}
    volumes:
      - backups:/backups
      - previews:/previews:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "${MAILCATCHER_HTTP_PORT}:${MAILCATCHER_HTTP_PORT}" # Web UI inbox
      - "${MAILCATCHER_SMTP_PORT}:${MAILCATCHER_SMTP_PORT}" # SMTP server
    networks:
      - internal
