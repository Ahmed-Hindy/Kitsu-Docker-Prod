networks:
  web:
    name: kitsu_web
    external: false
  internal:
    name: kitsu_internal
    external: false

volumes:
  pgdata:
    name: kitsu_pgdata
  traefik_letsencrypt:
    name: kitsu_traefik_letsencrypt
  backups:
    name: kitsu_backups
  previews:
    name: kitsu_previews
  meili:
    name: kitsu_meili

services:
  traefik:
    image: traefik:v3.7.6
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL to a real email address for Let's Encrypt}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      - traefik_letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web
    restart: unless-stopped

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kitsu}
      POSTGRES_USER: ${POSTGRES_USER:-kitsu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kitsu_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - internal

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - meili:/meili_data
    networks:
      - internal

  nginx:
    image: nginx:alpine
    depends_on:
      - kitsu-web
      - zou-api
      - zou-events
    ports:
      - "${KITSU_WEB_HOST_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=kitsu_web"
      - "traefik.http.services.kitsu.loadbalancer.server.port=80"
      - "traefik.http.routers.kitsu-http.rule=Host(`${KITSU_DOMAIN:-localhost}`)"
      - "traefik.http.routers.kitsu-http.entrypoints=web"
      - "traefik.http.routers.kitsu-http.service=kitsu"
      - "traefik.http.routers.kitsu-https.rule=Host(`${KITSU_DOMAIN:-localhost}`)"
      - "traefik.http.routers.kitsu-https.entrypoints=websecure"
      - "traefik.http.routers.kitsu-https.service=kitsu"
      - "traefik.http.routers.kitsu-https.tls=true"
      - "traefik.http.routers.kitsu-https.tls.certresolver=letsencrypt"
    restart: unless-stopped

  zou-api:
    image: ghcr.io/ahmed-hindy/kitsu-zou:${ZOU_VERSION:?Set ZOU_VERSION in versions.env}
    env_file:
      - .env
    ports:
      - "${ZOU_API_HOST_PORT:-5001}:${ZOU_API_INTERNAL_PORT:-8000}"
    environment:
      # ---- DB config (for Zou) ----
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${POSTGRES_DB}
      # ---- Redis / KV store ----
      KV_TYPE: redis
      KV_HOST: redis
      KV_PORT: ${REDIS_PORT}
      # ---- Meilisearch indexer ----
      INDEXER_TYPE: meilisearch
      INDEXER_HOST: meilisearch
      INDEXER_PORT: ${MEILI_PORT}
      INDEXER_KEY: ${MEILI_MASTER_KEY}
      # ---- Security / app settings ----
      SECRET_KEY: ${ZOU_SECRET_KEY}
      LOG_LEVEL: ${ZOU_LOG_LEVEL}

      MAIL_SERVER: mailcatcher
      MAIL_PORT: ${MAILCATCHER_SMTP_PORT}
      MAIL_DEFAULT_SENDER: "kitsu@example.com"
      MAIL_USE_TLS: false
      MAIL_USE_SSL: false
      DOMAIN_PROTOCOL: ${DOMAIN_PROTOCOL}
      DOMAIN_NAME: ${DOCKER_HOST_IP:-localhost}:${KITSU_WEB_HOST_PORT:-8080}
      CORS_ALLOWED_ORIGINS: ${KITSU_WEB_URL:-http://localhost:8080}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
    networks:
      - internal
    restart: unless-stopped

  zou-events:
    image: ghcr.io/ahmed-hindy/kitsu-zou:${ZOU_VERSION:?Set ZOU_VERSION in versions.env}
    env_file:
      - .env
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${POSTGRES_DB}

      KV_TYPE: redis
      KV_HOST: redis
      KV_PORT: ${REDIS_PORT}

      INDEXER_TYPE: meilisearch
      INDEXER_HOST: meilisearch
      INDEXER_PORT: ${MEILI_PORT}
      INDEXER_KEY: ${MEILI_MASTER_KEY}

      SECRET_KEY: ${ZOU_SECRET_KEY}
      LOG_LEVEL: ${ZOU_LOG_LEVEL}

      MAIL_SERVER: mailcatcher
      MAIL_PORT: ${MAILCATCHER_SMTP_PORT}
      MAIL_DEFAULT_SENDER: "kitsu@example.com"
      MAIL_USE_TLS: false
      MAIL_USE_SSL: false
      DOMAIN_PROTOCOL: ${DOMAIN_PROTOCOL}
      DOMAIN_NAME: ${DOCKER_HOST_IP:-localhost}:${KITSU_WEB_HOST_PORT:-8080}

    # run ONLY the events server here
    command: >
      gunicorn --workers=1 --worker-class=geventwebsocket.gunicorn.workers.GeventWebSocketWorker -b 0.0.0.0:${ZOU_EVENTS_INTERNAL_PORT:-5001} zou.event_stream:app

    # optional, for debugging from host:
    # ports:
    #   - "5002:${ZOU_API_PORT}"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
    networks:
      - internal
    restart: unless-stopped

  zou-init-db:
    image: ghcr.io/ahmed-hindy/kitsu-zou:${ZOU_VERSION:?Set ZOU_VERSION in versions.env}
    env_file:
      - .env
    environment:
      # ---- DB config (for Zou) ----
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${POSTGRES_DB}

      # ---- Redis / KV store ----
      KV_TYPE: redis
      KV_HOST: redis
      KV_PORT: ${REDIS_PORT}

      # ---- Meilisearch indexer ----
      INDEXER_TYPE: meilisearch
      INDEXER_HOST: meilisearch
      INDEXER_PORT: ${MEILI_PORT}
      INDEXER_KEY: ${MEILI_MASTER_KEY}

      # ---- Security / app settings ----
      SECRET_KEY: ${ZOU_SECRET_KEY}
      LOG_LEVEL: ${ZOU_LOG_LEVEL}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
      zou-api:
        condition: service_started
    networks:
      - internal
    entrypoint: [ "sh", "-c" ]
    command: >
      " echo '[zou-init-db] Running init-db (safe if already initialized)...'; zou init-db || echo '[zou-init-db] DB already initialized or init-db failed non-critically.';

      echo '[zou-init-db] Running init-data to populate default statuses and types...'; zou init-data || echo '[zou-init-db] init-data failed non-critically (e.g., data already exists).';

      echo '[zou-init-db] Creating admin (or skipping if it already exists)...'; zou create-admin ${ZOU_ADMIN_EMAIL} --password ${ZOU_ADMIN_PASSWORD} || echo '[zou-init-db] create-admin failed, possibly because the user already exists. Ignoring.'; echo '[zou-init-db] Done.'; "
    restart: "no"

  kitsu-web:
    image: ghcr.io/ahmed-hindy/kitsu-web:${KITSU_VERSION:?Set KITSU_VERSION in versions.env}
    environment:
      VITE_API_URL: /api
    depends_on:
      - zou-api
    networks:
      - web
      - internal
    restart: unless-stopped

  db-backup:
    build:
      context: ./backups
    image: ghcr.io/ahmed-hindy/kitsu-db-backup:latest
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGHOST: db
      BACKUP_CRON: ${BACKUP_CRON:-30 1 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "${MAILCATCHER_HTTP_PORT}:${MAILCATCHER_HTTP_PORT}" # Web UI inbox
      - "${MAILCATCHER_SMTP_PORT}:${MAILCATCHER_SMTP_PORT}" # SMTP server
    networks:
      - internal
